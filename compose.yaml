services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    init: true
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command:
      - python
      - -m
      - backend.app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --esp32-url
      - "${ESP32_URL:-}"
    volumes:
      - type: bind
        source: ${MODEL_DIR:-./ai_model/output/run_gpu01}
        target: /app/ai_model/output/run_gpu01
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    init: true
    restart: unless-stopped
